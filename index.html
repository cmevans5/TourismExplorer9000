<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tourism Explorer 9000 Academic Prototype</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <a class="skip-link" href="#mainContent">Skip to main content</a>

  <header class="topbar" role="banner">
    <h1>Tourism Explorer 9000</h1>
    <div class="topbar-actions">
      <button id="btnDashboard" class="btn secondary" aria-label="Open dashboard">Dashboard</button>
      <button id="btnReset" class="btn danger" aria-label="Start a new run">Start New Run</button>
    </div>
  </header>

  <main id="mainContent" tabindex="-1" role="main" aria-live="polite"></main>

  <div id="pipOverlay" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="pipTitle">
    <div class="modal">
      <h2 id="pipTitle">Pip - Learning Coach</h2>
      <div id="pipPanelContent"></div>
    </div>
  </div>

  <div id="dashboardPanel" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="dashboardTitle">
    <div class="modal wide">
      <h2 id="dashboardTitle">Destination and Learning Dashboard</h2>
      <div id="dashboardContent"></div>
      <button id="btnDashboardClose" class="btn">Close</button>
    </div>
  </div>

  <noscript>This experience requires JavaScript to run.</noscript>

  <script src="js/scoring.js"></script>
  <script src="js/adaptation.js"></script>
  <script src="js/state.js"></script>
  <script src="js/mission-validation.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
